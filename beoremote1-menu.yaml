        sequence: [{ choose: [], default: !input light_func4 }]
      - conditions: ['{{ keypress == "Light/Func5" }}']
        sequence: [{ choose: [], default: !input light_func5 }]
      - conditions: ['{{ keypress == "Light/Func6" }}']
        sequence: [{ choose: [], default: !input light_func6 }]
      - conditions: ['{{ keypress == "Light/Func7" }}']
        sequence: [{ choose: [], default: !input light_func7 }]
      - conditions: ['{{ keypress == "Light/Func8" }}']
        sequence: [{ choose: [], default: !input light_func8 }]
      - conditions: ['{{ keypress == "Light/Func9" }}']
        sequence: [{ choose: [], default: !input light_func9 }]
      - conditions: ['{{ keypress == "Light/Func10" }}']
