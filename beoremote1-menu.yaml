        sequence: [{ choose: [], default: !input light_func17 }]

      # --- Control list ---
      - conditions: ['{{ keypress == "Control/Func1" }}']
        sequence: [{ choose: [], default: !input control_func1 }]
      - conditions: ['{{ keypress == "Control/Func2" }}']
        sequence: [{ choose: [], default: !input control_func2 }]
      - conditions: ['{{ keypress == "Control/Func3" }}']
        sequence: [{ choose: [], default: !input control_func3 }]
      - conditions: ['{{ keypress == "Control/Func4" }}']
        sequence: [{ choose: [], default: !input control_func4 }]
