blueprint:
  name: 'BeoRemote One: Climate (keypad) — Mozart'
  description: >-
    Control a climate device from the BeoRemote One keypad (Control mode):
    Up/Down step temperature, Select toggles power, colour keys set HVAC mode,
    arrows change fan speed, digits jump to presets, and Green toggles Powerful
    / Boost. Unsupported roles do nothing instead of erroring.
  domain: automation
  input:
    beoproduct:
      name: Bang & Olufsen product
      description: The product the BeoRemote One is connected to.
      selector:
        device:
          integration: bang_olufsen
          multiple: false

    climate_target:
      name: Air conditioner
      description: The single climate entity to control.
      selector:
        entity:
          domain: climate

    temp_step:
      name: 'Up / Down: temperature step'
      description: Degrees each Up (warmer) / Down (cooler) press changes the target.
      default: 1
      selector:
        number:
          min: 0.5
          max: 5
          step: 0.5
          unit_of_measurement: °
          mode: slider

    preset_min:
      name: 'Digits: lowest preset temperature (Digit 1)'
      description: >-
        Digits 1-9 jump to temperatures spread evenly up to the highest preset;
        Digit 0 turns the AC off.
      default: 18
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: °
          mode: slider
    preset_max:
      name: 'Digits: highest preset temperature (Digit 9)'
      description: The temperature Digit 9 jumps to.
      default: 26
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: °
          mode: slider

    green_mode:
      name: 'Green key: HVAC mode'
      description: Used only when Powerful / Boost is cleared below.
      default: ''
      selector: &mode_selector
        select:
          mode: dropdown
          options:
            - { label: '— none —', value: '' }
            - { label: 'Off', value: 'off' }
            - { label: 'Cool', value: 'cool' }
            - { label: 'Heat', value: 'heat' }
            - { label: 'Heat/Cool', value: 'heat_cool' }
            - { label: 'Auto', value: 'auto' }
            - { label: 'Dry', value: 'dry' }
            - { label: 'Fan only', value: 'fan_only' }
    red_mode:
      name: 'Red key: HVAC mode'
      default: heat
      selector: *mode_selector
    yellow_mode:
      name: 'Yellow key: HVAC mode'
      default: dry
      selector: *mode_selector
    blue_mode:
      name: 'Blue key: HVAC mode'
      default: cool
      selector: *mode_selector

    powerful_preset:
      name: 'Powerful / Boost: preset name'
      description: >-
        Climate preset the Green key toggles (e.g. boost, powerful). Clear it to
        use Green for its HVAC mode instead.
      default: boost
      selector:
        text: {}

    # Per keypress: primary service when its gate is on, else fallback entity.
    notify_service:
      name: 'Primary notification: service name'
      description: >-
        Notify service to send AC state to first, e.g. "notify.lg_g2_65" for a
        TV. Skipped when its power entity is off.
      default: ''
      selector:
        text: {}

    notify_service_power:
      name: 'Primary notification: power entity'
      description: >-
        The primary service is used only while this entity is on, else it falls
        back below. Best the target's own media_player; defaults to the B&O
        product's when blank.
      default: ''
      selector:
        entity: {}

    notify_target:
      name: 'Fallback notification: entities'
      description: >-
        One or more notify entities (e.g. your phone) used when the primary is
        unset or off.
      default: []
      selector:
        entity:
          domain: notify
          multiple: true

    notify_target_service:
      name: 'Fallback notification: service name'
      description: >-
        A legacy notify service used as fallback, e.g. "notify.family_phones" for
        a notify group. For targets not selectable above, such as notify groups.
        Fires alongside any entities picked above.
      default: ''
      selector:
        text: {}

mode: queued
max_exceeded: silent
trigger:
  - platform: event
    event_type: bang_olufsen_websocket_event
    event_data:
      eventType: WebSocketEventBeoRemoteButton
      eventData:
        Type: KeyPress
      device_id: !input beoproduct
action:
  - variables:
      keypress: '{{ trigger.event.data.eventData.Key }}'
      climate_target: !input climate_target
      temp_step: !input temp_step
      preset_min: !input preset_min
      preset_max: !input preset_max
      green_mode: !input green_mode
      red_mode: !input red_mode
      yellow_mode: !input yellow_mode
      blue_mode: !input blue_mode
      # HVAC mode for the colour key pressed (else empty).
      key_mode: >-
        {{ {'Control/Green': green_mode, 'Control/Red': red_mode,
            'Control/Yellow': yellow_mode, 'Control/Blue': blue_mode}.get(keypress, '') }}
      powerful_preset: !input powerful_preset
      beoproduct: !input beoproduct
      notify_target: !input notify_target
      notify_service_power: !input notify_service_power
      notify_service: !input notify_service
      # Gate entity: chosen, else the B&O product's media_player.
      notify_power_entity: >-
        {{ notify_service_power if notify_service_power not in [none, ""]
           else (device_entities(beoproduct) | select('match', 'media_player') | first | default('')) }}
      # Service active when set and its gate isn't off.
      notify_service_active: >-
        {{ notify_service not in [none, ""]
           and (notify_power_entity in [none, ""]
                or states(notify_power_entity) not in
                   ['off', 'standby', 'unavailable', 'unknown']) }}
      # Any fallback entity picked? (list input)
      notify_target_set: '{{ (notify_target | default([]) | count) > 0 }}'
      notify_target_service: !input notify_target_service
      # Keys this blueprint owns (gates feedback).
      handled_keys: >-
        {{ ['Control/Select', 'Control/Play', 'Control/Stop', 'Control/Up',
            'Control/Down', 'Control/Left', 'Control/Right', 'Control/Green',
            'Control/Red', 'Control/Yellow', 'Control/Blue', 'Control/Digit0',
            'Control/Digit1', 'Control/Digit2', 'Control/Digit3', 'Control/Digit4',
            'Control/Digit5', 'Control/Digit6', 'Control/Digit7', 'Control/Digit8',
            'Control/Digit9'] }}
  - choose:
      # --- Powerful / Boost on Green (only if the preset exists, else falls through) ---
      - conditions:
          - >-
            {{ keypress == "Control/Green"
               and powerful_preset in (state_attr(climate_target, "preset_modes") or []) }}
        sequence:
          - service: climate.set_preset_mode
            target: { entity_id: !input climate_target }
            data:
              preset_mode: >-
                {% set cur = state_attr(climate_target, 'preset_mode') %}
                {{ 'none' if cur == powerful_preset else powerful_preset }}

      # --- Power ---
      - conditions: ['{{ keypress == "Control/Select" }}']
        sequence:
          - service: climate.toggle
            target: { entity_id: !input climate_target }
      - conditions: ['{{ keypress == "Control/Play" }}']
        sequence:
          - service: climate.turn_on
            target: { entity_id: !input climate_target }
      - conditions:
          ['{{ keypress == "Control/Stop" or keypress == "Control/Digit0" }}']
        sequence:
          - service: climate.turn_off
            target: { entity_id: !input climate_target }

      # --- Temperature step ---
      - conditions: ['{{ keypress == "Control/Up" }}']
        sequence:
          - service: climate.set_temperature
            target: { entity_id: !input climate_target }
            data:
              temperature: >-
                {{ [[ (state_attr(climate_target, 'temperature') | float(22)) + temp_step,
                      state_attr(climate_target, 'min_temp') | float(16) ] | max,
                    state_attr(climate_target, 'max_temp') | float(30) ] | min }}
      - conditions: ['{{ keypress == "Control/Down" }}']
        sequence:
          - service: climate.set_temperature
            target: { entity_id: !input climate_target }
            data:
              temperature: >-
                {{ [[ (state_attr(climate_target, 'temperature') | float(22)) - temp_step,
                      state_attr(climate_target, 'min_temp') | float(16) ] | max,
                    state_attr(climate_target, 'max_temp') | float(30) ] | min }}

      # --- Temperature presets (Digit 1→preset_min … 9→preset_max, snapped to 0.5° and clamped) ---
      - conditions:
          - '{{ keypress.startswith("Control/Digit") and keypress[-1] in "123456789" }}'
        sequence:
          - service: climate.set_temperature
            target: { entity_id: !input climate_target }
            data:
              temperature: >-
                {% set n = keypress[-1] | int - 1 %}
                {{ [[ ((preset_min + n / 8 * (preset_max - preset_min)) * 2) | round(0) / 2,
                      state_attr(climate_target, "min_temp") | float(16)] | max,
                    state_attr(climate_target, "max_temp") | float(30)] | min }}

      # --- Fan speed (Left slower / Right faster, clamped to the AC's fan_modes) ---
      - conditions:
          - '{{ keypress in ["Control/Left", "Control/Right"] }}'
          - '{{ ((state_attr(climate_target, "fan_modes") or []) | count) > 0 }}'
        sequence:
          - service: climate.set_fan_mode
            target: { entity_id: !input climate_target }
            data:
              fan_mode: >-
                {% set m = state_attr(climate_target, 'fan_modes') %}
                {% set c = state_attr(climate_target, 'fan_mode') %}
                {% set i = (m.index(c) if c in m else 0) %}
                {% set step = 1 if keypress == "Control/Right" else -1 %}
                {{ m[[[i + step, 0] | max, (m | count) - 1] | min] }}

      # --- HVAC mode (colour keys; skipped if unset/unsupported; Green only if Boost disabled) ---
      - conditions:
          - >-
            {{ key_mode not in [none, ""]
               and key_mode in (state_attr(climate_target, "hvac_modes") or []) }}
        sequence:
          - service: climate.set_hvac_mode
            target: { entity_id: !input climate_target }
            data: { hvac_mode: '{{ key_mode }}' }

  # --- Feedback: push AC state to the primary service, else the fallback entity ---
  - choose:
      - conditions:
          - >-
            {{ keypress in handled_keys
               and (notify_target_set or notify_service not in [none, ""]
                    or notify_target_service not in [none, ""]) }}
        sequence:
          # Let the state settle.
          - delay: { milliseconds: 400 }
          - variables:
              notify_message: >-
                {{ [
                     states(climate_target) | replace('_', ' ') | title,
                     ('%g°' | format(state_attr(climate_target, 'temperature'))) if state_attr(climate_target, 'temperature') is not none else '',
                     ('Fan ' ~ state_attr(climate_target, 'fan_mode')) if state_attr(climate_target, 'fan_mode') else '',
                     (state_attr(climate_target, 'preset_mode') | title) if state_attr(climate_target, 'preset_mode') not in [none, 'none'] else ''
                   ] | select | list | join(' · ') }}
          - if:
              # Primary (e.g. TV) while its gate is on.
              - '{{ notify_service_active }}'
            then:
              # Tolerate a race where the target went off after the gate read on.
              - service: '{{ notify_service }}'
                continue_on_error: true
                data:
                  title: Air conditioner
                  message: '{{ notify_message }}'
            else:
              # Fallback (e.g. phone) when primary is off/unset.
              - if:
                  - '{{ notify_target_set }}'
                then:
                  - service: notify.send_message
                    target:
                      entity_id: '{{ notify_target }}'
                    data:
                      title: Air conditioner
                      message: '{{ notify_message }}'
              - if:
                  - '{{ notify_target_service not in [none, ""] }}'
                then:
                  - service: '{{ notify_target_service }}'
                    continue_on_error: true
                    data:
                      title: Air conditioner
                      message: '{{ notify_message }}'
